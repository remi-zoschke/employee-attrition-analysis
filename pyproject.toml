[project]
name = "employee-attrition-analysis"
version = "0.1.0"
description = "Employee attrition analysis and predictive modeling (logistic regression + SHAP) for Meridian Pharma, based on the IBM HR Analytics dataset"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "great-tables==0.21.0",
    "nbclient>=0.11.0",
    "nbformat>=5.10.4",
    "pandas>=3.0.2",
    "plotly>=6.7.0",
    "pyarrow>=25.0.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "shap>=0.51.0",
    "statsmodels>=0.14.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "ruff>=0.15.18",
]
