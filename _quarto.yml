language:
  title-block-author-single: "Auteur"

project:
  type: default
  output-dir: output

format:
  html:
    output-file: index.html
    theme: [cosmo, styles/theme.scss]
    lang: fr
    toc: true
    toc-depth: 3
    toc-location: left
    number-sections: true
    code-fold: true
    code-tools: true
    logo: assets/logo.png
    embed-resources: true

execute:
  echo: false
  warning: false
  freeze: auto
